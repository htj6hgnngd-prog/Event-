name: VECTA live visual QA

on:
  push:
    branches:
      - feat/vecta-wedding-season-2027
    paths:
      - ".github/workflows/vecta-live-visual-qa.yml"
      - ".github/scripts/vecta-live-qa.cjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-qa:
    name: Browser QA against the existing Work deployment
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.23.4"
      - name: Install Playwright
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Inspect live typography, grids and interactive controls
        env:
          VECTA_LIVE_URL: https://vecta-weddings.vercel.app/
        run: node .github/scripts/vecta-live-qa.cjs
      - name: Upload diagnostic screenshots and report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vecta-live-visual-qa
          path: vecta-qa-artifacts/
          retention-days: 5
