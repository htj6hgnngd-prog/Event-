name: VECTA Weddings / Astro Build

on:
  push:
    branches:
      - feat/vecta-wedding-season-2027
    paths:
      - "vecta-next/**"
      - ".github/workflows/vecta-weddings-ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "vecta-next/**"
      - ".github/workflows/vecta-weddings-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.23.4"
      - name: Install dependencies
        working-directory: vecta-next
        run: npm install --no-audit --no-fund
      - name: Astro diagnostics
        working-directory: vecta-next
        run: npm run check
      - name: Build static wedding site
        working-directory: vecta-next
        run: npm run build
