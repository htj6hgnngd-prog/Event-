name: VECTA Luxury Editorial 03 — E2E QA

on:
  push:
    branches:
      - feat/vecta-wedding-season-2027
    paths:
      - ".github/workflows/vecta-luxury-qa.yml"
      - ".github/scripts/vecta-luxury-qa.cjs"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/vecta-luxury-qa.yml"
      - ".github/scripts/vecta-luxury-qa.cjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.23.4"
      - name: Prepare Playwright using installed Chrome
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.57.0
          which google-chrome
      - name: Test current MagicPath luxury editorial prototype
        run: node .github/scripts/vecta-luxury-qa.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: vecta-luxury-03-screenshots-and-qa
          path: vecta-luxury-qa/
          retention-days: 7
